<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#2a1f7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="400" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".75"/><stop offset=".45" stop-color="#ffc86b" stop-opacity=".18"/><stop offset="1" stop-color="#ffc86b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="470" cy="320" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffab3d"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="400" r="380" fill="url(#glow)"/>
  <!-- 光の粒 -->
  <g fill="#fff" opacity=".85">
    <circle cx="235" cy="250" r="7"/><circle cx="805" cy="300" r="9"/><circle cx="740" cy="170" r="5"/>
    <circle cx="300" cy="140" r="5"/><circle cx="860" cy="520" r="6"/><circle cx="170" cy="470" r="6"/>
  </g>
  <!-- 光球 -->
  <circle cx="512" cy="360" r="205" fill="#ffc86b" opacity=".45" filter="url(#soft)"/>
  <circle cx="512" cy="360" r="165" fill="url(#orb)"/>
  <!-- ランクアップのシェブロン -->
  <g transform="translate(0 20)" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 700 L512 580 L672 700" opacity="1"/>
    <path d="M352 860 L512 740 L672 860" opacity=".5"/>
  </g>
</svg>
