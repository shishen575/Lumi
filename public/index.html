<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumi Dashboard</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1f2430;--mut:#6b7280;--line:#e3e5ea;--acc:#5865f2;--danger:#d93a3a}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--card:#1f2229;--fg:#e8eaf0;--mut:#9aa1b0;--line:#2e323b;--acc:#7983f5;--danger:#ef6a6a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1}main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:13px}
input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
input[type=number]{width:110px}button{cursor:pointer;background:var(--acc);color:#fff;border:0}
button.sec{background:var(--bg);color:var(--fg);border:1px solid var(--line)}button.del{background:none;color:var(--danger);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}.tabs button{background:none;color:var(--mut);border:0;border-bottom:2px solid transparent;border-radius:0}
.tabs button.on{color:var(--fg);border-color:var(--acc)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;display:none}
.guild{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:600px){input[type=number]{width:90px}}
</style></head><body>
<header><h1 id="title">Lumi</h1><span id="who" class="mut"></span><button id="out" class="sec" hidden>ログアウト</button></header>
<main id="app"></main><div id="toast"></div>
<script src="/dash.js"></script>
</body></html>
