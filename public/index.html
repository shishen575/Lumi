<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumi ダッシュボード</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="dash.css">
<script>try{var t=localStorage.getItem('lumi-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="bar">
  <a class="brand" href="#"><img src="icon.svg" alt="">Lumi</a>
  <span class="grow"></span>
  <a class="bar-link" href="/docs.html" target="_blank" rel="noopener">説明書</a>
  <button class="icon-btn" id="theme" type="button" title="表示テーマ" aria-label="表示テーマを切り替え"></button>
  <span class="user" id="who" hidden></span>
  <button class="btn ghost sm" id="out" type="button" hidden>ログアウト</button>
</header>
<main id="app" aria-live="polite"></main>
<div id="toast" class="toast" role="status"></div>
<script src="dash.js"></script>
<script src="access.js"></script>
</body>
</html>
